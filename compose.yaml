# Homelab deployment. Works with `podman compose up -d` and `docker compose up -d`.
#
# Copy .env.example to .env and fill in the secrets before starting.

services:
  couchdb:
    image: docker.io/library/couchdb:3.5
    restart: unless-stopped
    # The image's own uid/gid. A mismatch here shows up as CouchDB dying during
    # startup on a permission error.
    user: "5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
      - couchdb-etc:/opt/couchdb/etc/local.d
    # Published so something outside the compose network - a Cloudflare tunnel
    # running on the host, say - can reach CouchDB without going through Caddy.
    # Bind to 127.0.0.1 by setting COUCHDB_BIND=127.0.0.1 when the port only has
    # to be reachable from the host itself; the default accepts LAN clients too.
    #
    # The port is protected by CouchDB's own admin account either way: the image
    # disables admin party as soon as COUCHDB_PASSWORD is set, and CouchHub's
    # provisioning then requires a valid user for everything except /_up.
    ports:
      - "${COUCHDB_BIND:-0.0.0.0}:${COUCHDB_PORT:-10021}:5984"
    healthcheck:
      # /_up stays reachable without credentials because CouchHub provisions
      # require_valid_user_except_for_up; without it this check would get 401 on
      # a perfectly healthy server.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  couchhub:
    # `make remote-deploy` builds the image on the developer's machine and sets
    # this to the local tag, so a small host never compiles anything.
    image: ${COUCHHUB_IMAGE:-ghcr.io/dearmai/couchhub:latest}
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      # Seals stored credentials. Losing it means every stored Setup URI
      # becomes unreadable and vaults have to be reissued.
      COUCHHUB_SECRET: ${COUCHHUB_SECRET:?set COUCHHUB_SECRET in .env}

      # The CouchDB below, so the install wizard does not ask for what this file
      # already configured. CouchHub registers and provisions it on first start;
      # the wizard is still there if it cannot.
      #
      # The administration address is the compose service, not the published
      # port: it is the shortest path and needs nothing published at all.
      # Built from SYNC_DOMAIN rather than defaulted to it: podman-compose does
      # not interpolate a variable nested inside another one's default, and
      # leaves ${A:-https://${B}} in the value verbatim - which then gets stored
      # as a vault's server address and fails on every client.
      COUCHHUB_COUCHDB_NAME: ${COUCHHUB_COUCHDB_NAME:-homelab}
      COUCHHUB_COUCHDB_URL: http://couchdb:5984
      COUCHHUB_COUCHDB_PUBLIC_URL: https://${SYNC_DOMAIN}
      COUCHHUB_COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER in .env}
      COUCHHUB_COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}
      COUCHHUB_POLL_INTERVAL: ${COUCHHUB_POLL_INTERVAL:-5m}
      # Vault document browser; see .env.example.
      COUCHHUB_DOCUMENTS: ${COUCHHUB_DOCUMENTS:-true}
    volumes:
      - couchhub-data:/data
    # Published for the same reason as CouchDB: a tunnel or proxy outside the
    # compose network needs a way in.
    #
    # Unlike CouchDB, the panel has no authentication of its own. Anything that
    # can reach this port can read every vault's credentials and reissue its
    # Setup URIs. Keep it to the host with COUCHHUB_BIND=127.0.0.1 and put the
    # access control in front of it - Cloudflare Access, or whatever terminates
    # the public hostname - rather than leaving it open on the LAN.
    ports:
      - "${COUCHHUB_BIND:-127.0.0.1}:${COUCHHUB_PORT:-10020}:10020"

  caddy:
    image: docker.io/library/caddy:2-alpine
    # Opt-in, because it is one of two ways to publish this stack and not the
    # only one. A Cloudflare tunnel reaching the published ports needs no proxy
    # here at all, and starting Caddy anyway would fail on a host that already
    # has something on 80/443.
    #
    # Start it with:  podman compose --profile proxy up -d
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - couchdb
      - couchhub
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?set SYNC_DOMAIN in .env}
      HUB_DOMAIN: ${HUB_DOMAIN:?set HUB_DOMAIN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  couchdb-data:
  couchdb-etc:
  couchhub-data:
  caddy-data:
  caddy-config:
